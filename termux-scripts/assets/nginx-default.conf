server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # OMNIBUS Dashboard (Flask server local)
    location / {
        proxy_pass http://127.0.0.1:7749;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para containers expostos
    # Exemplo: container 'web' na porta 3000 → http://localhost/web/
    location /web/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Terminal web (se servido separadamente)
    location /terminal/ {
        proxy_pass http://127.0.0.1:7749/terminal/;
    }
}
