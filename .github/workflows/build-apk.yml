name: OMNIBUS Docker Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  MAIN_MODULE: app

jobs:
  # ==========================================
  # JOB 1: Lint + Test
  # ==========================================
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

  # ==========================================
  # JOB 2: Build Debug APK
  # ==========================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # ==========================================
  # JOB 3: Build Signed Release APK
  # ==========================================
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=()
          [ -z "$SIGNING_KEY" ] && MISSING_SECRETS+=("SIGNING_KEY")
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING_SECRETS+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && MISSING_SECRETS+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && MISSING_SECRETS+=("KEY_PASSWORD")
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "ERROR: Required secrets are missing: ${MISSING_SECRETS[*]}"
            exit 1
          fi
          echo "✓ All required signing secrets are configured"

      - name: Decode Keystore
        run: |
          KEYSTORE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/android_keystore.XXXXXXXXXX")
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "$KEYSTORE_DIR/omnibus-docker.jks"
          echo "KEYSTORE_PATH=$KEYSTORE_DIR/omnibus-docker.jks" >> $GITHUB_ENV
          echo "KEYSTORE_DIR=$KEYSTORE_DIR" >> $GITHUB_ENV
          echo "✓ Keystore decoded to: $KEYSTORE_DIR"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK Signature
        run: |
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file not found: $APK_FILE"
            exit 1
          fi
          
          # Verify the APK is signed and capture output securely
          JARSIGNER_LOG="${RUNNER_TEMP}/jarsigner_output.txt"
          if ! jarsigner -verify -verbose -certs "$APK_FILE" 2>&1 | tee "$JARSIGNER_LOG"; then
            echo "ERROR: APK signature verification failed!"
            echo "=== jarsigner output ===" >> $GITHUB_STEP_SUMMARY
            cat "$JARSIGNER_LOG" >> $GITHUB_STEP_SUMMARY
            rm -f "$JARSIGNER_LOG"
            exit 1
          fi
          echo "✓ APK signature verified successfully"
          echo "=== APK Signature Verification ===" >> $GITHUB_STEP_SUMMARY
          cat "$JARSIGNER_LOG" >> $GITHUB_STEP_SUMMARY
          rm -f "$JARSIGNER_LOG"
          
          # Get file size and checksum
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "=== APK Details ===" >> $GITHUB_STEP_SUMMARY
          ls -lh "$APK_FILE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MD5 Checksum:" >> $GITHUB_STEP_SUMMARY
          md5sum "$APK_FILE" >> $GITHUB_STEP_SUMMARY
          echo "SHA256 Checksum:" >> $GITHUB_STEP_SUMMARY
          sha256sum "$APK_FILE" >> $GITHUB_STEP_SUMMARY

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Cleanup sensitive files
        if: always()
        run: |
          # Securely remove keystore directory
          if [ -n "${{ env.KEYSTORE_DIR }}" ] && [ -d "${{ env.KEYSTORE_DIR }}" ]; then
            echo "Securely removing keystore files from: ${{ env.KEYSTORE_DIR }}"
            CLEANUP_LOG="${RUNNER_TEMP}/cleanup.log"
            if find "${{ env.KEYSTORE_DIR }}" -type f -exec shred -vfz -n 3 {} \; 2>&1 | tee "$CLEANUP_LOG"; then
              echo "✓ Keystore files securely shredded"
            else
              echo "⚠ WARNING: Some files could not be shredded (see log above), proceeding with removal"
              cat "$CLEANUP_LOG"
            fi
            rm -rf "${{ env.KEYSTORE_DIR }}"
            rm -f "$CLEANUP_LOG"
            echo "✓ Keystore directory removed"
          else
            echo "ℹ No keystore directory to clean up"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
